<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webys</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toolbar">
    <button id="back" title="Back">←</button>
    <button id="forward" title="Forward">→</button>
    <button id="reload" title="Reload">⟳</button>
    <button id="home" title="Home">⌂</button>
    <form id="searchForm">
      <input id="search" autocomplete="off" placeholder="Search the web or enter a URL">
    </form>
    <span class="brand">Webys</span>
  </div>
  <div class="status" id="status">Jergan Studio • Webys</div>
  <script src="browser.js"></script>
</body>
</html>
