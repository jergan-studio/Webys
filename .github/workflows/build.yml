name: Build and Release Webys Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Webys
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build JavaFX app
        shell: cmd
        run: |
          if exist build rmdir /s /q build
          if exist dist rmdir /s /q dist
          mkdir build
          mkdir dist
          mkdir build\classes
          mkdir build\lib
          mvn -q dependency:copy-dependencies -DoutputDirectory=build\lib
          javac --module-path build\lib --add-modules javafx.controls,javafx.web -d build\classes src\main\java\com\jergan\webys\Webys.java
          xcopy /E /I /Y src\main\resources build\classes

      - name: Create JAR
        shell: cmd
        run: |
          jar --create --file dist\Webys.jar --main-class com.jergan.webys.Webys -C build\classes .

      - name: Create Windows application image
        shell: cmd
        run: |
          mkdir dist\app-input
          copy /Y dist\Webys.jar dist\app-input\Webys.jar
          xcopy /E /I /Y build\lib dist\app-input\lib
          jpackage ^
            --type app-image ^
            --name Webys ^
            --input dist\app-input ^
            --main-jar Webys.jar ^
            --main-class com.jergan.webys.Webys ^
            --dest dist ^
            --app-version 1.0.0 ^
            --java-options "--module-path $APPDIR/lib --add-modules javafx.controls,javafx.web"

      - name: Create portable ZIP
        shell: powershell
        run: Compress-Archive -Path dist\Webys\* -DestinationPath dist\Webys-Portable.zip -Force

      - name: Create Windows EXE installer
        shell: cmd
        run: |
          jpackage ^
            --type exe ^
            --name Webys ^
            --input dist\app-input ^
            --main-jar Webys.jar ^
            --main-class com.jergan.webys.Webys ^
            --dest dist ^
            --app-version 1.0.0 ^
            --java-options "--module-path $APPDIR/lib --add-modules javafx.controls,javafx.web" ^
            --win-dir-chooser ^
            --win-menu ^
            --win-shortcut

      - name: Create MSI installer
        shell: cmd
        run: |
          jpackage ^
            --type msi ^
            --name Webys ^
            --input dist\app-input ^
            --main-jar Webys.jar ^
            --main-class com.jergan.webys.Webys ^
            --dest dist ^
            --app-version 1.0.0 ^
            --java-options "--module-path $APPDIR/lib --add-modules javafx.controls,javafx.web" ^
            --win-dir-chooser ^
            --win-menu ^
            --win-shortcut

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Webys-JAR
          path: dist/Webys.jar
          if-no-files-found: error

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Webys-Portable
          path: dist/Webys-Portable.zip
          if-no-files-found: error

      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: Webys-Windows-EXE
          path: dist/Webys-1.0.0.exe
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: Webys-Windows-MSI
          path: dist/Webys-1.0.0.msi
          if-no-files-found: error

      - name: Publish Webys Latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Webys Latest
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            dist/Webys-1.0.0.exe
            dist/Webys-1.0.0.msi
            dist/Webys-Portable.zip
            dist/Webys.jar
