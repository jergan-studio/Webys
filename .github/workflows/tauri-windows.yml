name: Webys Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Webys Tauri app
        run: npm run tauri:build

      - name: Upload Webys EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: Webys-Windows-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Webys MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: Webys-Windows-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
