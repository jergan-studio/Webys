name: Webys Java Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Webys
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          javac -d build Webys.java
          jar --create --file Webys.jar --main-class Webys -C build .

      - name: Upload Webys.jar
        uses: actions/upload-artifact@v4
        with:
          name: Webys-Java
          path: Webys.jar

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Webys ${{ github.ref_name }}
          files: Webys.jar
          generate_release_notes: true
