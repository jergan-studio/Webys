[package]
name = "webys"
version = "1.0.0"
description = "Webys browser by Jergan Studio"
authors = ["Jergan Studio"]
edition = "2021"

[lib]
name = "webys_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
